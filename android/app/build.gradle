plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android' 
    id "com.google.gms.google-services" // Firebase plugin
    id 'dev.flutter.flutter-gradle-plugin'  // Flutter plugin
}


android {
    namespace = "com.appicator.itp_voice"
    compileSdk = 36
    // ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }


    signingConfigs {
        release {
            keyAlias "upload"
            keyPassword "itpvoice0000"
            storeFile file("/Users/umer/Downloads/ITPVoice_Umer-Updated_2.1.0/upload-keystore.jks")
            storePassword "itpvoice0000"
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.appicator.itp_voice"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 22
        versionName "2.1.2"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
    
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.1.1') // Firebase BoM
    implementation "androidx.fragment:fragment:1.3.6"
    implementation 'com.google.firebase:firebase-analytics' // Firebase Analytics
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith('process') && task.name.endsWith('GoogleServices')) {
        task.dependsOn 'preBuild'
    }
}
